[core]
copyFrom:ROOT:地球联合政府/步兵/t1步兵基础/t1步兵基础.ini,ROOT:地球联合政府/步兵/间谍/间谍.template,ROOT:unit-behaviors.template
name:间谍_伪装
displayText:间谍（伪装）
displayDescription:[渗透][伪装]\n-当前不会被敌军主动索敌\n-仍可被敌方玩家手动指定攻击\n-可以恢复为未伪装状态
price:800
maxHp:200
buildSpeed:20s
defineUnitMemory:unit disguiseTarget
radius:7
tags:Tech_1,Infantry,lives,间谍,Proxy

[graphics]
image:ROOT:shared/NONE.png
image_back:NONE
image_turret:NONE
showHealthBar:false
showEnergyBar:false

[attack]
canAttack:false
maxAttackRange:0

[attachment_伪装外观]
x:0
y:0
height:0
isUnselectable:true
canBeAttackedAndDamaged:false
keepAliveWhenParentDies:false
setDrawLayerOnTop:true
lockRotation:true

[hiddenAction_同步伪装附件]
autoTrigger:if self.attachment(slot='伪装外观')!=nullUnit and memory.disguiseTarget!=nullUnit and not self.hasFlag(id=30)
sendMessageTo:self.attachment(slot='伪装外观')
sendMessageWithTags:同步伪装阵营
sendMessageWithData:disguiseTarget=memory.disguiseTarget
addResources:setFlag=30

[action_恢复]
text:恢复
description:移除伪装，恢复为己方间谍
attachments_deleteNumUnits:1
attachments_onlyOnSlots:伪装外观
convertTo:间谍
buildSpeed:0
addResources:unsetFlag=30

[ai]
notPassivelyTargetedByOtherUnits:true
