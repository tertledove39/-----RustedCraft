[core]
copyFrom:ROOT:地球联合政府/步兵/t1步兵基础/t1步兵基础.ini,ROOT:地球联合政府/步兵/间谍/间谍.template,ROOT:unit-behaviors.template
name:间谍
displayText:间谍
displayDescription:[渗透][伪装][经济破坏]\n-靠近敌方资源抽取器或资源精炼站时，每10秒最多偷取500资金\n-在敌方离心机附近连续停留10秒可窃取科技\n-没有武器且不会自动攻击；手动指定敌方基础步兵可复制其外观和阵营色\n-伪装后不会被主动攻击
price:800
maxHp:200
buildSpeed:20s
defineUnitMemory:unit disguiseTarget
radius:7
tags:Tech_1,Infantry,lives,间谍,Valid

[graphics]
image:ROOT:地球联合政府/步兵/t1步兵基础/步兵基座.png
image_back:ROOT:地球联合政府/步兵/t1步兵基础/步兵身体(c).png
image_turret:NONE

[attack]
canAttack:true
disablePassiveTargeting:true
canAttackLandUnits:true
canAttackFlyingUnits:false
canAttackUnderwaterUnits:false
canOnlyAttackUnitsWithTags:可被间谍伪装
maxAttackRange:114514
showRangeUIGuide:false

[turret_伪装选择]
x:0
y:5
image:NONE
delay:30
projectile:伪装选择
onShoot_triggerActions:记录伪装目标

[projectile_伪装选择]
directDamage:0
life:10
instant:true
invisible:true

[hiddenAction_记录伪装目标]
setUnitMemory:disguiseTarget=thisActionTarget
alsoTriggerAction:伪装_T1步兵,伪装_喷火步兵,伪装_火箭步兵,伪装_狙击手,伪装_工程师,伪装_军医

[hiddenAction_伪装_T1步兵]
requireConditional:if memory.disguiseTarget.tags(includes='间谍外观_T1步兵')
attachments_addNewUnits:间谍伪装_T1步兵
attachments_onlyOnSlots:伪装外观
convertTo:间谍_伪装
clearAllWaypoints:true

