[core]
copyFrom   : ROOT:地球联合政府/步兵/t1步兵基础/t1步兵基础.ini,ROOT:unit-behaviors.template
name       : 闪流步兵
displayText: 闪流步兵
displayDescription:[对地][反装甲]\n-专业的反装甲单位\n-发射的电弧对机械目标具有不错的瘫痪效果
displayDescription_ja = [Earth] \ n-hearly安い土地ユニットですが、クラスター\ n-bulletが閉じた後も火力も激しいですが、命は安いです

defineUnitMemory:float maxAttackRange
price:600
maxHp:800
buildSpeed:5s


[graphics]
image_turret:闪流步兵_武器.png
turretImageScale:0.8



[attack]
maxAttackRange:160
canAttack:true
canAttackFlyingUnits:false
canAttackLandUnits:true
canAttackUnderwaterUnits:false
showRangeUIGuide:true
#isMelee:true
#meleeEngangementDistance:${attack.maxAttackRange}


[turret_1]


shouldResetTurret:true
chargeEffectImage: SHARED:lighting_charge.png
#复制自_1
canAttack:true
canAttackLandUnits:true
canAttackFlyingUnits:false
canAttackUnderwaterUnits:false
x:-3
y:5
idleDir:0
shoot_sound:lighting_burst
clearTurretTargetAfterFiring:true
size:10
warmup:30

[projectile_1]
image:NONE
tags:flash
shouldRevealFog:true
lightingEffect:true

directDamage:100
life:10
speed:13
trailEffect:false
lightColor:#FFFFFF
mutatorX_ifUnitWithTags:tank
mutatorX_directDamageMultiplier:5
mutatorX_addResourcesDirectHit:stop=1
instantReuseLast:true
instant:true
explodeEffect:CUSTOM:lightningShock, CUSTOM:sparks*8


explodeEffectOnShield:CUSTOM:lightningShock*1, CUSTOM:hitLightFlash



[effect_hitLightFlash]
priority:high

image: SHARED:light_50.png
life: 17
fadeOut: true
attachedToUnit: false
color: #63e6e8

scaleFrom: 1.8
scaleTo: 1.8
alpha: 0.6
drawUnderUnits:false


[effect_lightningShock]
life: 60


hOffset: 0
dirOffset: 0

fadeInTime: 0
fadeOut: false

attachedToUnit: true


image: SHARED:lightning_shock.png
total_frames: 14
animateFrameStart: 0
animateFrameEnd: 13
animateFramePingPong: false
animateFrameSpeed: 0.5



[effect_sparks]
attachedToUnit: false
life: 150
physics: true
xSpeedRelativeRandom: 1.6
ySpeedRelativeRandom: 1.6
hSpeed: 2
image: SHARED:spark.png
priority: verylow

[effect_sparks2]
attachedToUnit: false
life: 150
physics: true
xSpeedRelativeRandom: 0.5
ySpeedRelativeRandom: 0.5
hSpeed: 1
image: SHARED:spark.png
priority: verylow

[movement]
moveSpeed:0.72

[ai]
buildPriority:0.8



[resource_stop]
hidden:true