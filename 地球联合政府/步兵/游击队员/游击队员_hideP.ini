[core]
copyFrom:游击队员.ini

name:游击队员_hideP
displayText:游击队员
canNotBeDirectlyAttacked:true
energyRegen:0.00111111111111111111111111111111

[attack]
canAttack:false

[ai]
notPassivelyTargetedByOtherUnits:true

[graphics]
image:空.png
image_turret:空.png

showTransportBar:false
showHealthBar:false
showHealthBarChanges:false
showEnergyBar:false
showShieldBar:false
showQueueBar:false
showShotDelayBar:false


[action_hide]
text:战斗
description:将自身隐藏为平民 无法攻击但也不会被敌人攻击
convertTo:游击队员
buildSpeed:0s
isVisible:false

[decal_grade]
layer       : beforeUI
imageScale  : ${core.radius/20}
image       : ROOT:shared/levels.png
total_frames: 6
frame       : int(self.resource.grade)-1
xOffsetAbsolute:${core.radius/1.7}
yOffsetAbsolute:${core.radius/1.7}
alwaysStartDirAtZero:true
alwaysStartHeightAtZero:false
onlyTeam:ally

[decal_display]
image:ROOT:shared/选择框.png
onlyTeam:ally
onlyWhileAlive:true
alwaysStartDirAtZero:true
alwaysStartHeightAtZero:true


[action_hideP]
text:躲避
description:完全不可被地方发现
convertTo:游击队员_hideP
buildSpeed:0s
isVisible:false

[hiddenAction_return]
text:恢复
autoTrigger:if self.energy(full=true)
convertTo:游击队员
setUnitStats:energy=0


[action_1]
text:包扎
description:治疗一下自身\n-这需要一点时间
addResources:hp=500
price:energy=0.5
buildSpeed:0.3s
isVisible:false
[action_putBoob]
text       : 放置炸弹
description: 放置一枚威力巨大的炸弹, 对各种单位都有很好的毁伤效果\n但要是爆炸前就被敌人摧毁就不好了
description_ja:1個$50の梱包爆薬を置く。複数人で投げ込めば強化バンカーでもひとたまりもない
iconImage:雷管.png
price      : 50,energy=0.2
fireTurretXAtGround:boom
buildSpeed:0.2s
isVisible:false
