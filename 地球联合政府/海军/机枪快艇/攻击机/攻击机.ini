[core]
copyFrom:ROOT:地球联合政府/海军/机枪快艇/攻击机/空军单位参考.ini
name:奥卡攻击机改
displayDescription:早期攻击机 伤害真蛮高的\n-[高贵]拥有高贵的空军属性
displayDescription_ja = 早期攻撃航空機の損傷は本当に高く\ n- [高貴な空軍の属性を持つ

price:500
mass:1000
buildSpeed:20s
maxHp:240
radius:15
energyStartingPercentage:1
energyMax:1
disableAllUnitCollisions:true
tags:plane,planes,Valid
fireTurretXAtSelfOnDeath:1
isUnselectable:true
defineUnitMemory:unit parentd

[graphics]
image:攻击机.png
scaleImagesTo:30
image_shadow:AUTO
drawLayer:top

[attack]
maxAttackRange:40
canAttack:true
canAttackFlyingUnits:false
canAttackLandUnits:true
canAttackUnderwaterUnits:false
disablePassiveTargeting:true

[turret_1]
x:0
y:0
energyUsage:0
aimOffsetSpread:0
shoot_sound:攻击音效.wav

[projectile_1]
life:100
areaDamage:200
areaRadius:20
speed:3
buildingDamageMultiplier:0.6
explodeEffect:CUSTOM:boom
color:#FFFFFF00
hitSound:true
trailEffect:true
lightSize:1
lightColor:#FFFFFF00
lightCastOnGround:true

[action_attack]
autoTrigger:if self.energy(equalTo=1)
text:attack
addWaypoint_type:attack
addWaypoint_target_fromReference:parent.attacking
addWaypoint_triggerActionIfFailed:返航
isVisible:false
buildSpeed:0s

[action_parent]
autoTrigger:if self.hasParent()
setUnitMemory:parentd=parent
isVisible:false
[action_died]
autoTriggerOnEvent:destroyed
takeResources_includeReference:memory.parentd
takeResources:plane=-1
isVisible:false
[resource_plane]
hidden:true

[effect_boom]
alsoPlaySound:爆炸音效.wav

[action_full]
autoTrigger:if self.energy(equalTo=1)
temporarilyAddTags:energyFull
isVisible:false
[action_empty]
autoTrigger:if self.energy(equalTo=0)
temporarilyRemoveTags:energyFull
isVisible:false

[movement]
movementType:AIR
moveSpeed:2.5
moveAccelerationSpeed:0.5
moveDecelerationSpeed:0
landOnGround:false
targetHeight:50
maxTurnSpeed:3
turnAcceleration:1
moveSlidingMode:true
slowDeathFall:true
joinsGroupFormations:false
reverseSpeedPercentage:0


