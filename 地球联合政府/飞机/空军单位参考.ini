[core]
dont_load:true

[action_返航]
text:返航
displayType:action
buildSpeed:0
pos:0.1
autoTrigger:if not self.isAtGroundHeight and not self.isControlledByAI()
isVisible:false
addWaypoint_type:loadInto

addWaypoint_target_nearestUnit_team:own
addWaypoint_target_nearestUnit_tagged:空载机场


[action_结束]
text:结束
displayType:action
buildSpeed:0
pos:0.4
isVisible:false
clearAllWaypoints:true
autoTrigger:if self.energy(lessThan=1) and self.hasFlag(id=3)

addResources:unsetFlag=3

[action_AI返航]
text:ai返航
displayType:action
buildSpeed:1
pos:0.1
autoTrigger:if not self.isAtGroundHeight and self.energy(lessThan=1) and self.isControlledByAI
isVisible:false
addWaypoint_type:loadInto

addWaypoint_target_nearestUnit_team:own
addWaypoint_target_nearestUnit_tagged:空载机场
clearAllWaypoints:true
[action_装弹]
text:装弹
displayType:action
buildSpeed:1
pos:0.6
autoTrigger:if self.isAtGroundHeight
isVisible:false
addResources:energy=0.5, setFlag=3

[global_resource_机场位]
displayName:机场位
displayRoundedDown:true

[hiddenAction_机场位]
text:机场位
autoTriggerOnEvent:destroyed
addResources:机场位=1

[action_hormor_1]
text:王牌空军
description:更好的机组
isVisible:false
autoTrigger:if self.resource(type='hormor',greaterThan=1) and not self.hasFlag(id=4)
addResources:setFlag=4
setUnitStats:maxAttackRange+=40,maxHp+=300,armour+=20,energy+=3,hp+=300,movespeed+=0.2
spawnEffects:1
pos:1.1

[action_hormor_2]
text:王牌空军2
isVisible:false
description:更好的机组2
autoTrigger:if self.resource(type='hormor',greaterThan=0    ) and self.hasFlag(id=4)
addResources:hormor=-1
setUnitStats:hp+=30
spawnEffects:1
pos:1.2
[action_hormor_3]
text:王牌空军
isVisible:false
description:更好的机组
autoTrigger:if self.resource(type='hormor',lessThan=1) and self.hasFlag(id=4)
addResources:unsetFlag=4
setResourcesWithLogic:hormor=0
setUnitStats:maxAttackRange-=40,maxHp-=300,armour-=20,hp+=1,movespeed-=0.2
pos:1.3
[effect_1]
image:ROOT:地球联合政府/飞机/星星.png
attachedToUnit:true
ySpeedAbsolute:-1
life:60
dirSpeed:100



[resource_hormor]
hidden:false