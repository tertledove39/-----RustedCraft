[core]
name:世纪轰炸机
displayText:世纪轰炸机
displayText_ja:戦略爆撃機：Century
displayDescription:[固定翼飞机][反建筑/步兵]\n-由空军作战指挥部解锁的轰炸单位\n-航弹可以对建筑打出不错的杀伤\n-建造燃料精炼站后解锁的燃烧炸弹可以对大范围内的步兵造成致命的打击
displayDescription_ja = [固定翼航空機] [反アーキテクチャ/歩兵] \ n-n-a空軍戦闘本部によってロック解除された爆撃\ n-aviation爆弾は、建物を十分に殺すことができます\ nバーニング爆弾は燃料精製ステーションを建設した後、ロック解除されます。範囲内で致命的な打撃が発生します
copyFrom:ROOT:地球联合政府/飞机/空军单位参考.ini,ROOT:unit-behaviors.template
price:1200,机场位=1
mass:1000
buildSpeed:20s
maxHp:800
radius:16
energyStartingPercentage:1
energyMax:4
disableAllUnitCollisions:false
tags:plane,planes,Valid
fireTurretXAtSelfOnDeath:1

[graphics]
image:世纪轰炸机.png
scaleImagesTo:50
image_shadow:AUTO
drawLayer:top

[attack]
maxAttackRange:40
canAttack:true
canAttackFlyingUnits:false
canAttackLandUnits:true
canAttackUnderwaterUnits:false
disablePassiveTargeting:true

[turret_1]
x:0
y:0
energyUsage:1
aimOffsetSpread:0
canAttackCondition:if not self.hasFlag(id=5)
shoot_sound:攻击音效.wav

[projectile_1]
life:100
areaDamage:300
areaRadius:40
speed:3
buildingDamageMultiplier:1.2

[action_changeWeapon]
text:更换成燃烧炸弹
description:更换成反步兵为主的燃烧炸弹
addResources:setFlag=5
isVisible:if not self.hasFlag(id=5) and numberOfUnitsInTeam(withTag='燃料精炼站',greaterThan=0) and self.isAtGroundHeight
setResourcesWithLogic:energy=0

[action_changeWeapon_2]
text:更换成航弹
description:更换成反建筑为主的航空炸弹
addResources:unsetFlag=5
isVisible:if self.hasFlag(id=5) and self.isAtGroundHeight
setResourcesWithLogic:energy=0

[turret_2]
x:0
y:0
energyUsage:2
aimOffsetSpread:0
canAttackCondition:if self.hasFlag(id=5)
projectile:2

[projectile_2]
life:100
areaDamage:40
areaRadius:100
flameWeapon:true

buildingDamageMultiplier:1.2
targetGround:true
spawnUnit:fire

[action_AI返航]
text:ai返航
displayType:action
buildSpeed:1
pos:0.1
autoTrigger:if not self.isAtGroundHeight and self.energy(lessThan=4) and self.isControlledByAI
isVisible:false
addWaypoint_type:loadInto

addWaypoint_target_nearestUnit_team:own
addWaypoint_target_nearestUnit_tagged:空载机场

[action_AI攻击]
text:AI攻击
displayType:action
buildSpeed:1
pos:0.1
autoTrigger:if self.energy(equalTo=4) and self.isControlledByAI
isVisible:false
addWaypoint_type:attack

addWaypoint_target_nearestUnit_team:enemy
addWaypoint_target_nearestUnit_tagged:tank

[movement]
movementType:AIR
moveSpeed:2
moveAccelerationSpeed:0.1
moveDecelerationSpeed:0
landOnGround:false
targetHeight:50
maxTurnSpeed:1.5
turnAcceleration:1
moveSlidingMode:false
slowDeathFall:true
joinsGroupFormations:false
reverseSpeedPercentage:0


[action_hormor_1]
text:王牌空军
description:更好的机组
autoTrigger:if self.resource(type='hormor',greaterThan=1) and not self.hasFlag(id=4)
addResources:setFlag=4
setUnitStats:maxAttackRange+=40,maxHp+=300,armour+=20,energy+=4,hp+=400,movespeed+=1
spawnEffects:1


[action_hormor_3]
text:王牌空军
description:更好的机组
autoTrigger:if self.resource(type='hormor',lessThan=1) and self.hasFlag(id=4)
addResources:unsetFlag=4
setResourcesWithLogic:hormor=0
setUnitStats:maxAttackRange-=40,maxHp-=300,armour-=20,hp+=1,movespeed-=1


[global_resource_机场位]
displayName:机场位
displayRoundedDown:true

