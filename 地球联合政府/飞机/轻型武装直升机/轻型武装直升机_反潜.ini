[core]
copyFrom:ROOT:unit-behaviors.template
name:轻型武装直升机_反潜升级
displayDescription:[螺旋桨飞机][反步兵]\n-勉强能用的武装直升机\n-火力孱弱\n-建造空军作战指挥部后火力更强且获得一个可以对外开火的驻军位\n-加装反潜声纳之后可以使地方潜艇上浮
displayDescription_ja = [反輸送] [反輸送] \ N軍のヘリコプターは、かろうじて使用できる\ n-firepowerの弱点\ n-空軍戦闘本部を建設した後、それを受け入れた後、地元の潜水艦が浮かぶことができます
price:1000
mass:1000
radius:8
tags:反潜,planes,Valid

maxHp:500
buildSpeed:20s

[action_升级]
convertTo:轻型武装直升机_火箭飞弹
isVisible:if self.resource.grade>2
text:升级成火箭飞弹型号
buildSpeed:10s
isLocked:if self.transportingCount(greaterThan=0)

[hiddenAction_addExp1]
buildSpeed:0
autoTriggerOnEvent   : killedAnyUnit
addResourcesWithLogic: exp=2*(eventSource.priceCredits()+eventSource.resource.exp*0.5)

[hiddenAction_addHp1]
autoTrigger:if numberOfUnitsInTeam(withTag='机场',greaterThan=0,withinRange=120)
addResources:hp=10

[graphics]
image:轻型武装直升机.png
scaleImagesTo:50
image_shadow:AUTO

[attack]
maxAttackRange:120
canAttack:true
canAttackFlyingUnits:false
canAttackLandUnits:true
canAttackUnderwaterUnits:false

[turret_1]
x:0
y:0
projectile:1
shoot_sound:开火音效.wav


[projectile_1]
life:150
explodeOnEndOfLife:true
directDamage:30
drawSize:0.8
lightSize:0.5
lightColor:#AAFF6666
speed:11
explodeEffect:smoke
image:子弹.png

[arm_1]
x:0
y:0.5
image_end:直升机旋翼.png

drawOverBody: true

spinRate:15

[movement]
movementType:AIR
moveSpeed:1.5
moveAccelerationSpeed:0.01
moveDecelerationSpeed:0.005
landOnGround:true
targetHeight:40
maxTurnSpeed:1
turnAcceleration:0.01
moveSlidingMode:true
slowDeathFall:true
joinsGroupFormations:false
reverseSpeedPercentage:0
targetHeightDrift:5
moveIgnoringBody:true
heightChangeRate:0.05
fallingAcceleration:0.001
