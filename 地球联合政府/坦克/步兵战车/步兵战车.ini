[core]
copyFrom:ROOT:地球联合政府/坦克/装甲单位模板.ini,ROOT:unit-behaviors.template
name:步兵战车
displayText:步兵战车
displayDescription:[装甲][反步兵]\n-机动性好的装甲单位\n-拥有一个可以对外开火的载员位\n-可以被升级成各种专门型号
displayDescription_ja = [アーマー] [反産業] \ n-armoredユニットが優れた操作可能性を備えた\ n火災を開くことができるキャリアの位置をパットする\ n-n-canは、さまざまな特別なモデルにアップグレードされます
mass:1000
price:450
maxHp:700
radius:15
buildSpeed:15s
maxTransportingUnits:1
transportSlotsNeeded:4
armour:2


[attachment_1]
x:0
y:0
isVisible:false
canBeAttackedAndDamaged:false
canAttack:true
addTransportedUnits:true

[graphics]
image:坦克底盘.png
scaleImagesTo:30
turretImageScale:1.2
dustEffect:true
image_shadow:SHADOW:坦克底盘.png


[attack]
maxAttackRange:120
canAttack:true
canAttackFlyingUnits:false
canAttackLandUnits:true
canAttackUnderwaterUnits:false
showRangeUIGuide:true

[turret_1]
image:简单炮塔(c).png
x:0
y:0
shoot_sound:missile_fire
shoot_light:#FF000000
recoilOffset:-3
recoilOutTime:2
recoilReturnTime:10
delay:15

[projectile_1]
speed:11
image:抛射体.png
life:100
directDamage:40
drawSize:0.7
lightCastOnGround:true
lightColor:#AAFF6666

explodeEffect:smoke

[movement]
movementType:LAND
moveSpeed:1.2
moveAccelerationSpeed:0.1
moveDecelerationSpeed:0.1
reverseSpeedPercentage:0.4
maxTurnSpeed:3
turnAcceleration:1.2
moveSlidingMode:1




[action_update]
text:防空升级
description:升级成可以对空的防空车,但代价是失去对地的能力
convertTo:步兵战车_防空车
price:300
buildSpeed:15s
whenBuilding_cannotMove:true

[action_fire]
text:喷火升级
isLocked:if not self.numberOfUnitsInTeam(withTag='燃料精炼站',greaterThan=0)
whenBuilding_cannotMove:true
description:升级成对地的喷火车,提升了反建筑的能力
convertTo:步兵战车_喷火车
price:300
buildSpeed:15s
