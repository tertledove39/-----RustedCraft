[core]
name       : 模板
price      : 1000
maxHp      : 500
mass       : 100
radius     : 20
stayNeutral:true 
tags       : tank,Valid
copyFrom:ROOT:templete/mech.ini,ROOT:unit-behaviors.template

[graphics]
image:坦克底盘.png

image_shadow:AUTO
[attack]
canAttack:false


[movement]
movementType:LAND

[resource_stop]
hidden:true

[resource_speedtank]
hidden:true

[action_hormor_1]
text:王牌陆军
description:更好的机组
isVisible:false
autoTrigger:if self.resource(type='speedtank',greaterThan=1) and not self.hasFlag(id=3)
addResources:setFlag=3
setUnitStats:movespeed+=1
spawnEffects:1
pos:1.1


[action_hormor_2]
text:王牌陆军2
isVisible:false
description:更好的车组2
autoTrigger:if self.resource(type='speedtank',greaterThan=0    ) and self.hasFlag(id=3)
addResources:speedtank=-1
setUnitStats:hp+=5
spawnEffects:1
pos:1.2




[action_hormor_3]
text:王牌陆军
isVisible:false
description:更好的车组
autoTrigger:if self.resource(type='speedtank',lessThan=1) and self.hasFlag(id=3)
addResources:unsetFlag=3
setResourcesWithLogic:speedtank=0
setUnitStats:movespeed-=1
pos:1.3


[effect_1]
image         : ROOT:地球联合政府/飞机/星星.png
attachedToUnit: true
ySpeedAbsolute: -1
life          : 60
dirSpeed      : 100


[hiddenAction_BeFu]
autoTriggerOnEvent    : tookDamage(withTag='辐射')
clearAllWaypoints     : true
switchToAggressiveTeam:true
requireConditional:if self.hp<${core.maxHp*0.5}
addResources          : setFlag=4
setUnitStats: armour=0,movespeed=0,maxTurnSpeed=0,maxAttackRange=0

temporarilyAddTags: canBeOccupy

[hiddenAction_BeOccupy]
autoTrigger       : if self.teamId() != -2 and self.hasFlag(id=4)
resetUnitStats    : true
resetToDefaultTags: true
alsoTriggerAction:reset



[hiddenAction_return]
buildSpeed        : 1s
requireConditional: if self.hasFlag(id=6) and self.teamId() != -2
addResources:unsetFlag=6
resetUnitStats    : true
alsoTriggerAction:reset
