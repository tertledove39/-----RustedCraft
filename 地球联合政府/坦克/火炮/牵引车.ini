[core]
copyFrom:ROOT:地球联合政府/坦克/装甲单位模板.ini,ROOT:unit-behaviors.template
name:牵引车
displayText:火炮（折叠）
displayDescription:[装甲][无法攻击]\n-可以展开成火炮
displayDescription_ja = [アーマー] [攻撃できない] \ n-canは砲兵に打ち上げられます
mass:1000
price:900
maxHp:600
radius:20
buildSpeed:30s
dieOnConstruct:true
nanoRange:20
transportSlotsNeeded:4
energyMax:1
energyRegen:0.001
energyStartingPercentage:0


[graphics]
image:ROOT:运输车.png
scaleImagesTo:40
total_frames:2
animation_moving_start:0
animation_moving_end:1
animation_moving_speed:5
turretImageScale:1.5
dustEffect:true
showEnergyBar:true


[attack]
canAttack:false
maxAttackRange:420
showRangeUIGuide:true


[movement]
movementType:LAND
moveSpeed:0.9
moveAccelerationSpeed:0.1
moveDecelerationSpeed:0.1
reverseSpeedPercentage:0.4
maxTurnSpeed:2
turnAcceleration:1.2
moveSlidingMode:1


[action_1]
text:展开
convertTo:牵引式火炮
buildSpeed:2s
whenBuilding_cannotMove:true


[hiddenAction_触发]
autoTrigger:if self.isEnergyFull and self.isControlledByAI
alsoQueueAction:1


[hiddenAction_AI]
displayType:action
buildSpeed:1
pos:0.1
autoTrigger:if self.hp(greaterThan=150) and self.isControlledByAI
addWaypoint_type:move
addWaypoint_target_nearestUnit_team:enemy
addWaypoint_target_nearestUnit_tagged:lives,tank
