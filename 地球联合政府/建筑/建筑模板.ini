[core]
dont_load: true
tags     : building,Valid

[hiddenAction_GiveBuildingTag]
autoTrigger: true
temporarilyAddTags:building

[hiddenAction_GiveBuildingTagInit]
autoTriggerOnEvent:created
temporarilyAddTags:building

[hiddenAction_间谍资金扣除]
autoTriggerOnEvent:newMessage(withTag='间谍资金扣除')
requireConditional:if eventData(name='amount',type='number')>0
addResourcesWithLogic:credits=-eventData(name='amount',type='number')
