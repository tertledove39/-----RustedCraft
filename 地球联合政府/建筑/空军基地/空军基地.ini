[core]
name: 空军基地
copyFrom:ROOT:地球联合政府/建筑/建筑模板.ini,ROOT:unit-behaviors.template
displayText:空军基地
price:1000
mass:114514
radius:40
buildSpeed:25s
maxHp:2000
armour:1
displayDescription:[建筑][生产]\n-生产空军单位\n-每个空军基地提供三个固定翼飞机的生产权限
displayDescription_ja = [建築] [生産] \ Nプロダクション空軍ユニット\ n-各空軍基地に3つの固定翼航空機の生産権が提供されます

isBuilding:true
footprint:-2,0,2,2
constructionFootprint:-2,0,2,2
canBuild_1_name:setRally
canBuild_1_pos:0
maxTransportingUnits:3
transportUnitsBlockAirAndWaterUnits:false
tags:机场,Valid
transportUnitsHealBy:0.5
transportUnitsAddUnloadOption:false
borrowResourcesWhileAlive:机场位=-3
transportUnitsRequireTag:plane

[attachment_1]
x:-28
y:4
height:1
idleDir:0
isUnselectable:false
canBeAttackedAndDamaged:true
keepAliveWhenParentDies:false
setDrawLayerOnTop:true
lockRotation:true
addTransportedUnits:1
deattachIfWantingToMove:true


[attachment_2]
x:28
y:4
height:1
idleDir:0
isUnselectable:false
canBeAttackedAndDamaged:true
keepAliveWhenParentDies:false
setDrawLayerOnTop:true
lockRotation:true
addTransportedUnits:1
deattachIfWantingToMove:true

[hiddenAction_空载]
autoTrigger:if not self.transportingCount(greaterThan=2)
temporarilyAddTags:空载机场

[hiddenAction_满载]
autoTrigger:if self.transportingCount(greaterThan=2)
resetToDefaultTags:true

[attachment_3]
x:0
y:-14
height:1
idleDir:0
isUnselectable:false
canBeAttackedAndDamaged:true
keepAliveWhenParentDies:false
setDrawLayerOnTop:true
lockRotation:true
addTransportedUnits:1
deattachIfWantingToMove:true

[graphics]
image:空军基地.png
scaleImagesTo:100

[action_精英预备队]
text:精英预备队
description:升级后，本空军基地生产的单位出厂时获得1000点经验
price:1000
buildSpeed:15s
pos:0.1
allowMultipleInQueue:false
isVisible:if not self.hasFlag(id=30)
addResources:setFlag=30

[hiddenAction_精英预备队_出厂]
autoTriggerOnEvent:queuedUnitFinished
requireConditional:if self.hasFlag(id=30)
sendMessageTo:eventSource
sendMessageWithTags:精英预备队_空军

[hiddenAction_压制方案]
autoTrigger:if self.resource(type="credits",greaterThan=6000) and self.customTimer(laterThanSeconds=75) and self.isControlledByAI
addResources:-500
resetCustomTimer:true
alsoQueueAction:奥卡
[hiddenAction_奥卡]
produceUnits:奥卡攻击机
buildSpeed:20s
[attack]
canAttack:false


[movement]
movementType:BUILDING

[canBuild_奥卡战机]

name:奥卡攻击机
pos:1

[canBuild_哈迪斯拦截机]

name:哈迪斯拦截机
pos:2

[canBuild_世纪轰炸机]
isVisible:if self.hasUnitInTeam(withTag='空军作战指挥部',greaterThan=0)
name:世纪轰炸机
pos:3

[canBuild_运输直升机]
isVisible:if self.hasUnitInTeam(withTag='空军作战指挥部',greaterThan=0)
name:运输直升机
pos:4
[canBuild_轻型武装直升机]

name:轻型武装直升机
pos:5

[global_resource_机场位]
displayName:机场位
displayRoundedDown:true
[ai]
buildPriority:0.14
noneInBaseExtraPriority:0.56
recommendedInEachBaseNum:3
recommendedInEachBasePriorityIfUnmet:0.3
maxEachBase:15
