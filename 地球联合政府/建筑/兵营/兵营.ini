[core]
name              : 兵营
displayText       : 兵营
displayText_ja    : 兵舎
copyFrom          : ROOT:地球联合政府/建筑/建筑模板.ini,ROOT:unit-behaviors.template
displayDescription: [建筑][生产]\n-生产步兵的建筑\n-建造t2科技建筑后会获得新的步兵
displayDescription_ja = [建築] [生産] \ n- T2テクノロジービルディング後に歩兵の建物\ n-willを取得します
price:700
mass:114514
radius:30
buildSpeed:10s
maxHp:1500
armour:1
isBuilding:true
footprint:-1,-1,0,0
constructionFootprint:-1,-1,0,0
buildingToFootprintOffsetX:0
buildingToFootprintOffsetY:0
canBuild_1_name:setRally
canBuild_1_pos:0
tags:兵营,Valid

[graphics]
image:兵营.png
scaleImagesTo:40


[attack]
canAttack:false

[action_精英预备队]
text:精英预备队
description:升级后，本兵营生产的单位出厂时获得500点经验
price:1500
buildSpeed:10s
pos:0.1
allowMultipleInQueue:false
isVisible:if not self.hasFlag(id=30)
addResources:setFlag=30

[hiddenAction_精英预备队_出厂]
autoTriggerOnEvent:queuedUnitFinished
requireConditional:if self.hasFlag(id=30)
sendMessageTo:eventSource
sendMessageWithTags:精英预备队_步兵

[hiddenAction_火箭]
produceUnits:t1火箭步兵
buildSpeed:15s
alsoQueueAction:喷火


[hiddenAction_喷火]
produceUnits:t1喷火步兵
buildSpeed:10s
alsoQueueAction:喷火2


[hiddenAction_喷火2]
produceUnits:t1喷火步兵
buildSpeed:10s
alsoQueueAction:步兵


[hiddenAction_步兵]
produceUnits:t1步兵
buildSpeed:5s


[movement]
movementType:BUILDING


[canBuild_t1步兵]
name:t1步兵
pos:1

[canBuild_喷火步兵]
isVisible:if self.hasUnitInTeam(withTag='燃料精炼站',greaterThan=0)
name:t1喷火步兵
pos:2

[canBuild_基建工程兵]
isVisible:if self.hasUnitInTeam(withTag='第七国际联络部',greaterThan=0)
name:基建工程兵
pos:2.1

[canBuild_迫击炮手]
name:迫击炮手
pos:2.5

[canBuild_工程师]
name:工程师
pos:2.6

[canBuild_政委]
isVisible         : if self.hasUnitInTeam(withTag='大洋国真理部',greaterThan=0)
isLockedAlt       : if self.hasUnitInTeam(withTag='政委',greaterThan=0)
isLockedAltMessage: 不允许同时有超过一名英雄
name              : 政委
pos               : 7

[canBuild_特种兵]
isVisible:if self.hasUnitInTeam(withTag='伏罗希洛夫军事学院',greaterThan=0)
isLockedAlt:if self.hasUnitInTeam(withTag='特种兵',greaterThan=0)
isLockedAltMessage:不允许同时有超过一名英雄
name:特种兵
pos:8

[canBuild_游击队员]
isVisible:if self.hasUnitInTeam(withTag='第七国际联络部',greaterThan=0)
isLockedAlt:if self.hasUnitInTeam(withTag='游击队员',greaterThan=0)
isLockedAltMessage:不允许同时有超过一名英雄
name:游击队员
pos:9

[canBuild_间谍]
name:间谍
isVisible:if self.hasUnitInTeam(withTag='第七国际联络部',greaterThan=0) or self.hasUnitInTeam(withTag='大洋国真理部',greaterThan=0) or self.hasUnitInTeam(withTag='大洋国真理部',greaterThan=0)
pos:3.5

[canBuild_狙击手]
name:t1狙击手
pos:4

[canBuild_火箭步兵]
name:t1火箭步兵
pos:5

[canBuild_风暴突击队]
isVisible:if self.hasUnitInTeam(withTag='大洋国真理部',greaterThan=0)
name:t2风暴突击队
pos:6

[canBuild_军医]
name:军医
pos:5

[canBuild_t2步兵]
isVisible:if self.hasUnitInTeam(withTag='大洋国真理部',greaterThan=0)
name:t2步兵
pos:8

[canBuild_人民突击队]
isVisible: if self.hasUnitInTeam(withTag='伏罗希洛夫军事学院',greaterThan=0)
name     : 人民突击队
pos      : 8

[canBuild_辐射步兵]
isVisible: if self.hasUnitInTeam(withTag='离心机',greaterThan=0)
name     : 辐射步兵
pos      : 9

[canBuild_磁暴步兵]
isVisible:if self.hasUnitInTeam(withTag='磁暴塔',greaterThan=0)
name:磁暴步兵
pos:9.1


[ai]
buildPriority:0.15
noneInBaseExtraPriority:0.6
recommendedInEachBaseNum:3
recommendedInEachBasePriorityIfUnmet:0.35
maxEachBase:17
