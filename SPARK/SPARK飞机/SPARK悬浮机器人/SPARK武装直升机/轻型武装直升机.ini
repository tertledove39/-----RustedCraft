[core]
copyFrom:ROOT:unit-behaviors.template
name:武装直升机
displayDescription:[螺旋桨飞机][反机器人]\n-勉强能用的武装直升机\n-火力孱弱
mass:1000
radius:10
tags:planes,Valid
price:0
maxHp:200
buildSpeed:70s



[graphics]
image:武装直升机.png
scaleImagesTo:30
image_shadow:AUTO
lock_body_rotation_with_main_turret:true

[attack]
canAttack:true
canAttackFlyingUnits:false
canAttackLandUnits:true
canAttackUnderwaterUnits:false
maxAttackRange:140
setMainTurretAs:1

[turret_1]
x:0
y:0
projectile:1
shoot_sound:gun_fire
#limitingAngle:30



[hiddenAction_addExp]
buildSpeed:0
autoTriggerOnEvent   : killedAnyUnit
addResourcesWithLogic: exp=2*(eventSource.priceCredits()+eventSource.resource.exp*0.5)
[hiddenAction_initSelfExtraExp]
autoTriggerOnEvent:created
addResources:selfExtraPrice=400






[projectile_1]
life:150
explodeOnEndOfLife:true
directDamage:80
drawSize:0.8
lightSize:0.5
lightColor:#AAFF6666
speed:11
explodeEffect:smoke
frame:1



[movement]

movementType:AIR
moveSpeed:1.2
moveAccelerationSpeed:0.03
moveDecelerationSpeed:0.02
landOnGround:false
maxTurnSpeed:4
turnAcceleration:0.3
reverseSpeedPercentage:0
