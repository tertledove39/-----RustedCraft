[core]
copyFrom: _drone.template
name: death_drone
displayText: 「死神」无人轰炸机
displayDescription: [无人机]\n-强大但脆弱的无人机,装备死神导弹(单发)

mass: 100
radius: 6

maxHp: 50
energyMax: 8

[graphics]
image: death.png

[attack]
maxAttackRange: 80
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
#disablePassiveTargeting:true

[turret_1]
x: 0
y: 0
energyUsage: 8
aimOffsetSpread: 0

[projectile_1]
image: death_missile.png
life: 200
directDamage: 1200
speed: 1
trailEffect: true

[movement]
movementType: AIR
moveSpeed: 2.6
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0
landOnGround: false
targetHeight: 20
maxTurnSpeed: 2
turnAcceleration: 1
slowDeathFall: false
reverseSpeedPercentage: 0

[hiddenAction_wrongDeck]
# 换装后旧型号的无人机（包括还没回舱、仍在外面飞的）立刻自毁。
# 否则它会飞回来占掉新甲板的格子，把新造的那架挤成地图上的散机。
autoTrigger: if memory.deck != null and memory.deck.tags(includes='deck_all') and (not memory.deck.tags(includes='deck_death'))
deleteSelf: true