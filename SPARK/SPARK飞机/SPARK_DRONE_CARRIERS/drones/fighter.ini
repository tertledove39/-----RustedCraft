[core]
copyFrom: _drone.template
name: fighter_drone
displayText: 「斗士」突击无人战斗机
displayDescription: [无人机]\n-实验性战斗机,带无人机护盾发生器\n-使用轻型离子炮战斗\n-由于带护盾,必须定时返回母舰补充能源

mass: 150
radius: 7

maxHp: 120
energyMax: 4
energyRegen: -0.003

maxShield: 120
shieldRegen: 0.1
shieldRenderRadius: 10
shieldDisplayOnlyDeflection: true

[graphics]
image: fighter.png

[attack]
maxAttackRange: 60
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits: true
canAttackUnderwaterUnits: false
isFixedFiring: true

[turret_1]
x: 0
y: 0
projectile: 1
invisible: true

shoot_sound: plasma_fire
shoot_sound_vol: 0.06
shoot_flame: NONE
shoot_light: #eefbff
delay: 20

[projectile_1]
directDamage: 12
life: 100
speed: 7
frame: 11
drawSize: 1

lightColor: #eefbff
lightSize: 0.4

[effect_projectileTrail]
createWhenZoomedOut: false
priority:low

image: SHARED:/light_50.png
life: 30
fadeOut: true
attachedToUnit: false
color: #63e6e8
fadeInTime:2
scaleFrom: 0.7
scaleTo: 1.2
alpha: 0.4
drawUnderUnits:true
ySpeedRelative:-0.4
atmospheric: true

[movement]
movementType: AIR
moveSpeed: 2.8
moveAccelerationSpeed: 1
moveDecelerationSpeed: 0
landOnGround: false
targetHeight: 20
targetHeightDrift: 5
maxTurnSpeed: 4
turnAcceleration: 2
slowDeathFall: false
reverseSpeedPercentage: 0

[hiddenAction_back]
autoTrigger: if (not self.hasActiveWaypoint(type="loadInto")) and (memory.deck.hasFlag(id=24) or memory.deck.hasFlag(id=25) or (not memory.deck.parent.isAttacking()) or (self.energy() < 1))

[hiddenAction_attack]
autoTrigger: if (not (memory.deck.hasFlag(id=24) or memory.deck.hasFlag(id=25))) and (not self.hasActiveWaypoint(type="attack")) and memory.deck.parent.isAttacking() and (self.energy() >= 3.8)

[hiddenAction_wrongDeck]
# 换装后旧型号的无人机（包括还没回舱、仍在外面飞的）立刻自毁。
# 否则它会飞回来占掉新甲板的格子，把新造的那架挤成地图上的散机。
autoTrigger: if memory.deck != null and memory.deck.tags(includes='deck_all') and (not memory.deck.tags(includes='deck_fighter'))
deleteSelf: true