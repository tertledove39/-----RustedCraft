[core]
copyFrom: _drone.template
name: sabre_drone
displayText: 「军刀」重型无人轰炸机
displayDescription: [无人机]\n-被设计为能够突破防空火力网的重装轰炸机\n-装备2发炸弹,带无人机护盾发生器

mass: 200
radius: 8

maxHp: 200
energyMax: 6

maxShield: 120
shieldRegen: 0.1
shieldRenderRadius: 10
shieldDisplayOnlyDeflection: true

[graphics]
image: sabre.png

[attack]
maxAttackRange: 40
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
attackMovement: bomber

[turret_1]
#bomber
invisible: true
x: 0
y: 0
idleDir:0
projectile: 1
size: 1.1
turnSpeed: 20

energyUsage: 3

[projectile_1]
#bomb
life: 250
speed: 0.3
targetSpeed: 1.7
drawSize: 1
color: #000000
trailEffect: false
largeHitEffect: true

targetGround: true
areaDamage: 200
areaRadius: 55

#for laser defence
deflectionPower: 3

[movement]
movementType: AIR
moveSpeed: 0.9
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0
landOnGround: false
targetHeight: 20
maxTurnSpeed: 1.4
turnAcceleration: 0.04
slowDeathFall: false
reverseSpeedPercentage: 0

[hiddenAction_wrongDeck]
# 换装后旧型号的无人机（包括还没回舱、仍在外面飞的）立刻自毁。
# 否则它会飞回来占掉新甲板的格子，把新造的那架挤成地图上的散机。
autoTrigger: if memory.deck != null and memory.deck.tags(includes='deck_all') and (not memory.deck.tags(includes='deck_sabre'))
deleteSelf: true