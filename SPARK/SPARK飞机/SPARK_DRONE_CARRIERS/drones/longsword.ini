[core]
copyFrom: _drone.template
name: longsword_drone
displayText: 「长剑」远程无人轰炸机
displayDescription: [无人机]\n-能够远距离投射火力的无人机,装备6连发小型火箭炮

mass: 100
radius: 6

maxHp: 60
energyMax: 6

[graphics]
image: longsword.png

[attack]
maxAttackRange: 200
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
#disablePassiveTargeting:true

[turret_1]
x:0
y:0
energyUsage: 1
delay: 40
aimOffsetSpread: 0.1

[projectile_1]
directDamage: 40
life: 200
frame: 4
drawSize: 0.5
speed: 1.6
targetSpeedAcceleration: 0.1
targetSpeed: 6
lightSize: 0.8
lightColor: #FF882200
buildingDamageMultiplier: 0.4
trailEffect: true

[movement]
movementType: AIR
moveSpeed: 2
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0
landOnGround: false
targetHeight: 20
maxTurnSpeed: 2
turnAcceleration: 1
slowDeathFall: false
reverseSpeedPercentage: 0

[hiddenAction_wrongDeck]
# 换装后旧型号的无人机（包括还没回舱、仍在外面飞的）立刻自毁。
# 否则它会飞回来占掉新甲板的格子，把新造的那架挤成地图上的散机。
autoTrigger: if memory.deck != null and memory.deck.tags(includes='deck_all') and (not memory.deck.tags(includes='deck_longsword'))
deleteSelf: true