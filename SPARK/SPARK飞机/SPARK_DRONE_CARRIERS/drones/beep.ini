[core]
copyFrom: _drone.template
name: beep_drone
displayText: 「蜂鸣」无人拦截机
displayDescription: [无人机]\n-防空拦截机,配备单发闪电炮

mass: 100
radius: 5

maxHp: 70
energyMax: 1

[graphics]
image: beep.png

[attack]
maxAttackRange: 60
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits: false
canAttackUnderwaterUnits: false
isFixedFiring: true

[turret_1]
x: 0
y: 2
projectile: 1
turnSpeed: 0
turnSpeedAcceleration: 0
warmup: 30
invisible: true
energyUsage: 1

[projectile_1]
directDamage: 40
life: 25
instant: true
lightingEffect: true
shieldDamageMultiplier: 1
shieldDefectionMultiplier: 0.1

[movement]
movementType: AIR
moveSpeed: 3.2
moveAccelerationSpeed: 4
moveDecelerationSpeed: 0
landOnGround: false
targetHeight: 20
targetHeightDrift: 5
maxTurnSpeed: 4
slowDeathFall: false
reverseSpeedPercentage: 0

[hiddenAction_attack]
autoTrigger: if (not (memory.deck.hasFlag(id=24) or memory.deck.hasFlag(id=25))) and (not self.hasActiveWaypoint(type="guard")) and self.isEnergyFull() and memory.deck.parent.isAttacking()
addWaypoint_type: guard

[hiddenAction_wrongDeck]
# 换装后旧型号的无人机（包括还没回舱、仍在外面飞的）立刻自毁。
# 否则它会飞回来占掉新甲板的格子，把新造的那架挤成地图上的散机。
autoTrigger: if memory.deck != null and memory.deck.tags(includes='deck_all') and (not memory.deck.tags(includes='deck_beep'))
deleteSelf: true
