[core]
copyFrom: _deck.template
name: deck_prisma
displayText: 「棱镜」甲板
displayDescription: [无人机甲板]\n-允许3架「棱镜」无人战斗机起降\n-缺失无人机整备时间:6s\n-「棱镜」无人战斗机配备小型光束武器

maxTransportingUnits: 3

[graphics]
image: prisma.png

[attachment_1]
x: 0
y: 0
idleDir: 0
isVisible: true
isUnselectable: true
keepAliveWhenParentDies: false
deattachIfWantingToMove: true
addTransportedUnits: true
canAttack: false
resetRotationWhenNotAttacking: true
rotateWithParent: false

[attachment_2]
@copyFromSection: attachment_1
x: 4
y: 2

[attachment_3]
@copyFromSection: attachment_1
x: -4
y: -2

[hiddenAction_buildDrone]
buildSpeed: 6s
addUnitsIntoTransport: prisma_drone
requireConditional: if self.numberOfAttachedUnits() <= ${core.maxTransportingUnits}
[action_change2deck_prisma]
isVisible: false