[core]
copyFrom: ROOT:/unit-behaviors.template, ROOT:/SPARK/SPARK飞机/SPARK_DRONE_CARRIERS/drone_carrier.template
name: assault_drone_carrier
displayText: 「强袭」级无人机母舰
displayDescription: [无人机母舰][T2]\n-带有双联装对地火炮的无人机\n-拥有1个无人机甲板\n-装甲较薄弱,但拥有能量护盾

mass: 4000
radius: 20
tags: planes, Valid
price: 0
maxHp: 400
buildSpeed: 80s
techLevel: 2

maxShield: 600
shieldRegen: 0.2
shieldRenderRadius: 22

[graphics]
image: assault_drone_carrier.png
image_shadow: AUTO

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits: true
canAttackUnderwaterUnits: false
maxAttackRange: 600
turretMultiTargeting: true

[turret_cannon1]
#left cannon
x: -2
y: 2
size: 8
image: barrel.png
attachedTo: base
slave: true
projectile: 1
delay: 60
warmup: 10
limitingRange: 200
turnSpeed: 0
idleDir: 0

canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

recoilOffset: -6
recoilOutTime: 3
recoilReturnTime: 17

[turret_cannon2]
#left cannon
copyFrom: cannon1
x: 2
y: 2
linkDelayWithTurret: cannon1
warmup: 10

[turret_base]
x: 11
y: 4
image: base.png
canShoot: true
projectile: fake

turnSpeed: 2
# 这个假炮塔（projectile: fake，0 伤害、不可见）只负责让母舰能“锁定目标”。
# 子机的起飞条件是 memory.deck.parent.isAttacking()，
# 如果这里写 false，点空军时母舰不接受攻击指令，子机就永远不起飞。
# 真正开火的是子机，所以这里允许对空不会再让母舰凭空打出伤害。
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

idleDir: 0
idleDirReversing: 0
limitingRange: ${attack.maxAttackRange}

[projectile_1]
life: 150
speed: 4.5
largeHitEffect: true
frame: 2
targetGround: true
areaDamage: 60
areaRadius: 30

lightColor: #ffe92b
lightSize: 0.4

targetGroundSpread: 20
initialUnguidedSpeedHeight: 0
gravity: 0.18
lightCastOnGround: true

[projectile_fake]
life: 0
speed: 0
invisible: true
directDamage: 0

[hiddenAction_addExp]
buildSpeed: 0
autoTriggerOnEvent   : killedAnyUnit
addResourcesWithLogic: exp = 2 * (eventSource.priceCredits() + eventSource.resource.exp * 0.5)

[hiddenAction_initSelfExtraExp]
autoTriggerOnEvent: created
addResources:selfExtraPrice = 400

[movement]
movementType: AIR
moveSpeed: 2
moveAccelerationSpeed: 0.04
moveDecelerationSpeed: 0.01
landOnGround: false
maxTurnSpeed: 1
turnAcceleration: 1
reverseSpeedPercentage: 0

[action_selectSlot26]
@define slotId: 26
buildSpeed: 0s
text: [
textAddUnitName: unitRef self.attachment(slot="unitSlot${slotId}")
textPostFix: ]

descriptionAddFromUnit: unitRef self.attachment(slot="unitSlot${slotId}")
descriptionAddUnitStats: unitRef self.attachment(slot="unitSlot${slotId}")

addResources: unsetFlag=26-27, setFlag=${slotId}
isGuiBlinking: if self.hasFlag(id=${slotId})
displayType: action
unitShownInUI: unitRef self.attachment(slot="unitSlot${slotId}")

iconExtraIsVisible: if self.hasFlag(id=${slotId})
iconExtraImage: ROOT:/SPARK/SPARK飞机/SPARK_DRONE_CARRIERS/icon_selected.png
pos: 3

canPlayerCancel: false
allowMultipleInQueue: false
alwaysSinglePress: true

[attachment_unitSlot26]
@define slotId: 26
x: -11
y: 6
idleDir:0
idleDirReversing:0

onCreateSpawnUnitOf: deck_fighter
setDrawLayerOnTop: true
lockLegMovement: false

keepAliveWhenParentDies: false
isUnselectable: true
showAllActionsFrom: if self.hasFlag(id=${slotId})
lockRotation: true
rotateWithParent: true

[action_placeHolder]
text: 占位符
displayType: infoOnly
isVisible: true

