[core]
copyFrom: ROOT:/unit-behaviors.template, ROOT:/SPARK/SPARK飞机/SPARK_DRONE_CARRIERS/drone_carrier.template
name: legion_heavy_battlecarrier
displayText: 「军团」级重型战航
displayDescription: [无人机母舰][T3]\n-重装甲,装备前向对地加农炮\n-拥有4个无人机甲板\n-带有高射炮防空火力网

mass: 12000
radius: 36
tags: planes, Valid
price: 0
maxHp: 4000
armour: 20

buildSpeed: 240s
techLevel: 3

[graphics]
image: legion_heavy_battlecarrier.png
image_shadow: AUTO

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits: true
canAttackUnderwaterUnits: false
maxAttackRange: 600
turretMultiTargeting: true

[turret_fake]
x: 0
y: 0
invisible: true
canShoot: true
projectile: fake
turnSpeed: 2

idleDir: 0
idleDirReversing: 0
limitingRange: ${attack.maxAttackRange}

[projectile_fake]
life: 0
speed: 0
invisible: true
directDamage: 0

[turret_cannon1]
# left cannon
x: -10
y: 0
size: 20
image: cannon.png
projectile: cannon
delay: 60
warmup: 20
limitingRange: 220
limitingMinRange: 50
idleDir: -50
limitingAngle: 70
turnSpeed: 1

canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

recoilOffset: -4
recoilOutTime: 3
recoilReturnTime: 37

[turret_cannon2]
# right cannon
copyFrom: cannon1
x: 10
y: 0
idleDir: 50

[projectile_cannon]
life: 150
speed: 8
frame: 2
directDamage: 100
color: #ff2bdc
lightColor: #ff2bdc
lightSize: 0.5

[turret_flakgunD]
# front double flakgun
x: 0
y: 28
barrelX: -2
barrelY: 6
barrelOffsetX_onOddShots: 4
image: double_flakgun.png
projectile: aagun
delay: 30

limitingRange: 160
idleDir: 0
limitingAngle: 80
turnSpeed: 3

canAttackFlyingUnits: true
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

recoilOffset: -2
recoilOutTime: 3
recoilReturnTime: 17

[turret_flakgunL]
# left flakgun
x: -23.5
y: 1.5
size: 5
image: flakgun.png
projectile: aagun
delay: 60

limitingRange: 160
idleDir: -90
limitingAngle: 100
turnSpeed: 3.2

canAttackFlyingUnits: true
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

recoilOffset: -2
recoilOutTime: 3
recoilReturnTime: 17

[turret_flakgunR]
# right flakgun
copyFrom: flakgunL
x: 23.5
y: 1.5
idleDir: 90

[projectile_aagun]
life: 240
speed: 20
trailEffect: true
largeHitEffect: true
frame: 0

areaDamage: 60
areaRadius: 60
autoTargetingOnDeadTarget: true
lightColor: #ffff00
lightSize: 0.4

[hiddenAction_addExp]
buildSpeed: 0
autoTriggerOnEvent   : killedAnyUnit
addResourcesWithLogic: exp = 2 * (eventSource.priceCredits() + eventSource.resource.exp * 0.5)

[hiddenAction_initSelfExtraExp]
autoTriggerOnEvent: created
addResources:selfExtraPrice = 400

[movement]
movementType: AIR
moveSpeed: 0.8
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
landOnGround: false
maxTurnSpeed: 0.5
turnAcceleration: 1
reverseSpeedPercentage: 0.8

[action_selectSlot26]
@define slotId: 26
buildSpeed: 0s
text: [
textAddUnitName: unitRef self.attachment(slot="unitSlot${slotId}")
textPostFix: ]

descriptionAddFromUnit: unitRef self.attachment(slot="unitSlot${slotId}")
descriptionAddUnitStats: unitRef self.attachment(slot="unitSlot${slotId}")

addResources: unsetFlag=26-29, setFlag=${slotId}
isGuiBlinking: if self.hasFlag(id=${slotId})
displayType: action
unitShownInUI: unitRef self.attachment(slot="unitSlot${slotId}")

iconExtraIsVisible: if self.hasFlag(id=${slotId})
iconExtraImage: ROOT:/SPARK/SPARK飞机/SPARK_DRONE_CARRIERS/icon_selected.png
pos: 3

canPlayerCancel: false
allowMultipleInQueue: false
alwaysSinglePress: true

[action_selectSlot27]
@copyFromSection: action_selectSlot26
@define slotId: 27

[action_selectSlot28]
@copyFromSection: action_selectSlot26
@define slotId: 28

[action_selectSlot29]
@copyFromSection: action_selectSlot26
@define slotId: 29

[attachment_unitSlot26]
@define slotId: 26
x: -20
y: 19
idleDir:0
idleDirReversing:0

onCreateSpawnUnitOf: deck_sabre
setDrawLayerOnTop: true
lockLegMovement: false

keepAliveWhenParentDies: false
isUnselectable: true
showAllActionsFrom: if self.hasFlag(id=${slotId})
lockRotation: true
rotateWithParent: true

[attachment_unitSlot27]
@copyFromSection: attachment_unitSlot26
@define slotId: 27
x: 20
y: 19
idleDir:0
idleDirReversing:0

[attachment_unitSlot28]
@copyFromSection: attachment_unitSlot26
@define slotId: 28
x: -20
y: -19
idleDir:180
idleDirReversing:0

[attachment_unitSlot29]
@copyFromSection: attachment_unitSlot26
@define slotId: 29
x: 20
y: -19
idleDir:180
idleDirReversing:0
