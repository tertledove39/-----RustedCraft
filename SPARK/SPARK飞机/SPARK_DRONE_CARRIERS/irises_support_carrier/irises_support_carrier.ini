[core]
copyFrom: ROOT:/unit-behaviors.template, ROOT:/SPARK/SPARK飞机/SPARK_DRONE_CARRIERS/drone_carrier.template
name: irises_support_carrier
displayText: 「鸢尾」级支援航母
displayDescription: [无人机母舰][T2]\n-远程支援无人机母舰,拥有3个无人机甲板\n-装备长距离通用支援导弹

mass: 8000
radius: 28
tags: planes, Valid
price: 0
maxHp: 1000
buildSpeed: 140s
techLevel: 2

[graphics]
image: irises_support_carrier.png
image_shadow: AUTO

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits: true
canAttackUnderwaterUnits: false
maxAttackRange: 600

[hiddenAction_addExp]
buildSpeed: 0
autoTriggerOnEvent   : killedAnyUnit
addResourcesWithLogic: exp = 2 * (eventSource.priceCredits() + eventSource.resource.exp * 0.5)

[hiddenAction_initSelfExtraExp]
autoTriggerOnEvent: created
addResources:selfExtraPrice = 400

[turret_1]
x: 3.5
y: 9.5
barrelX: 4
barrelY: 4
barrelOffsetX_onOddShots: -8
image: missile_launcher.png
shoot_sound: missile_fire

idleSweepSpeed: 0.3
idleSweepAngle: 60
idleSweepDelay: 180
idleSweepAddRandomDelay: 100
idleSweepAddRandomAngle: 20

delay: 180
aimOffsetSpread: 0.1

[projectile_1]
directDamage: 45
life: 200
frame: 4
drawSize: 0.5
speed: 1
targetSpeedAcceleration: 0.1
targetSpeed: 6
lightSize: 0.8
lightColor: #FF882200
buildingDamageMultiplier: 0.4
trailEffect: true

[movement]
movementType: AIR
moveSpeed: 1
moveAccelerationSpeed: 0.02
moveDecelerationSpeed: 0.02
landOnGround: false
maxTurnSpeed: 0.5
turnAcceleration: 1
reverseSpeedPercentage: 0

[action_selectSlot26]
@define slotId: 26
buildSpeed: 0s
text: [
textAddUnitName: unitRef self.attachment(slot="unitSlot${slotId}")
textPostFix: ]

descriptionAddFromUnit: unitRef self.attachment(slot="unitSlot${slotId}")
descriptionAddUnitStats: unitRef self.attachment(slot="unitSlot${slotId}")

addResources: unsetFlag=26-28, setFlag=${slotId}
isGuiBlinking: if self.hasFlag(id=${slotId})
displayType: action
unitShownInUI: unitRef self.attachment(slot="unitSlot${slotId}")

iconExtraIsVisible: if self.hasFlag(id=${slotId})
iconExtraImage: ROOT:/SPARK/SPARK飞机/SPARK_DRONE_CARRIERS/icon_selected.png
pos: 3

canPlayerCancel: false
allowMultipleInQueue: false
alwaysSinglePress: true

[action_selectSlot27]
@copyFromSection: action_selectSlot26
@define slotId: 27

[action_selectSlot28]
@copyFromSection: action_selectSlot26
@define slotId: 28

[attachment_unitSlot26]
@define slotId: 26
x: -12
y: 13
idleDir:0
idleDirReversing:0

onCreateSpawnUnitOf: deck_longsword
setDrawLayerOnTop: true
lockLegMovement: false

keepAliveWhenParentDies: false
isUnselectable: true
showAllActionsFrom: if self.hasFlag(id=${slotId})
lockRotation: true
rotateWithParent: true

[attachment_unitSlot27]
@copyFromSection: attachment_unitSlot26
@define slotId: 27
x: -12
y: 31
idleDir:0
idleDirReversing:0

[attachment_unitSlot28]
@copyFromSection: attachment_unitSlot26
@define slotId: 28
x: 17
y: 4
idleDir:0
idleDirReversing:0

[action_placeHolder]
text: 占位符
displayType: infoOnly
isVisible: true
pos: 4
