[ai]
useAsBuilder:true

[hiddenAction_initSelfExtraExp]
autoTriggerOnEvent:created
addResources:selfExtraPrice=200

[hiddenAction_resolution]
autoTrigger:if self.isControlledByAI() and numberOfUnitsInTeam(withinRange=150,greaterThan=1) and rnd(1,60)==1
alsoTriggerAction:解放




[action_解放]
text:「解放」
description:建造者解放自身以给周围单位增加「馈赠」以获得特殊效果\n-会使你失去这个建造者\n-在工厂旁边「解放」可以升级科技或加速生产\n-在单位旁「解放」可以为其回复生命值并为其提供经验值
#deleteSelf:true
#alsoTriggerAction:解放
fireTurretXAtGround:1
fireTurretXAtGround_withOffset:0,0
#
buildSpeed:1s
addResources:setFlag=31
pos:0
setUnitStats:movespeed=0
isLocked:if self.hasFlag(id=31)
deleteSelf:true

[hiddenAction_addhpByGift]
autoTrigger:false

[hiddenAction_addhpByExp]
autoTrigger:false


[hiddenAction_subHp]
autoTrigger:if self.hasFlag(id=31)
#fireTurretXAtGround:1
#fireTurretXAtGround_withOffset:0,0
addResourcesWithLogic:hp=${core.maxHp}*(-0.1)

[turret_1]
x:0
y:0

[projectile_1]
life: 10
#areaDamage:0
#areaRadius:300
#mutatorX_addResourcesAreaHit:Gift=10
#mutatorX_ifUnitWithoutTags:NULLTAG
#friendlyFire:only-ignoreEnemy
#explodeOnEndOfLife:true
deflectionPower:-1
#explodeEffect:NONE
directDamage:0
spawnUnit:gift_giver



