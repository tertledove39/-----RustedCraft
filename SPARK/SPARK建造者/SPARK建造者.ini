[core]
copyFrom:ROOT:SPARK/SPARK.template,ROOT:unit-behaviors.template

name:SPARK T1 建造者
displayText:T1 建造者
displayDescription:[建造][无法攻击][T1][陆地]\n早期的建造机器人,建造速度似乎不太快...\n没有任何武装,请小心敌人的袭击
#overrideAndReplace:builder
canRepairBuildings:true
canRepairUnits:false
autoRepair:false
buildSpeed:30s
tags:T1,Valid
radius:10
maxHp:100
price:600
mass:1000
isUnrepairableUnit:true


[graphics]
image:建造者.png
image_shadow:SHADOW:建造者.png
shadowOffsetX:4
shadowOffsetY:4
image_offsetY:0
scaleImagesTo:32
repairEffectAtTarget:CUSTOM:repair
repairEffectRate:180
repairEffect:CUSTOM:repair2



[movement]
movementType:LAND
moveSpeed:0.6
targetHeight:1
targetHeightDrift:1
moveAccelerationSpeed:0.1
moveDecelerationSpeed:0.1

maxTurnSpeed:4
turnAcceleration:8


[attack]
canAttack:false

#[turret_1]
#x:0
#y:0

[effect_repair]
life:360
showInFog:false
priority:high
attachedToUnit:true
#atmospheric:true
image:维修效果c.png
total_frames:6
animateFrameStart:0
animateFrameEnd:5
animateFrameSpeed:0.5
animateFrameSpeedRandom:0.2
animateFrameLooping:true
teamColorRatio:0.1

dirSpeed:1
dirSpeedRandom:0.3

[effect_repair2]
life:360
showInFog:false
priority:high
attachedToUnit:true
#atmospheric:true
image:圆圈.png
total_frames:1
scaleTo:3
scaleFrom:0.01
teamColorRatio:0.3
#shadow:true
hSpeed:0.01
fadeInTime:20
fadeOut:true
dirSpeed:100
alpha:0.6


