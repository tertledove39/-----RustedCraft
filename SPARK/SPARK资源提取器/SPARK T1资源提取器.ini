[core]

copyFrom:ROOT:SPARK/SPARK.template,ROOT:unit-behaviors.template
name:SPARK T1资源提取器
displayText:T1资源提取器
displayDescription:[玛锌][无法攻击][T1][建筑]\n用于获取质量的小型机器
mass:100000
buildSpeed:30s
price:0
radius:15
maxHp:900
generation_credits:10
borrowResourcesWhileAlive:maxFactories=-3

tags:resourcesBuilding,Valid
isBuilding:true
footprint:0,0,0,0
constructionFootprint:0,0,0,0
placeOnlyOnResPool:true
buildingToFootprintOffsetY:7
effectOnDeath: resourcePoolSmoke
[graphics]
image:SPARK T1资源提取器.png
scaleImagesTo:48

image_shadow:SHADOW:SPARK T1资源提取器.png
shadowOffsetX:2
shadowOffsetY:2

[attack]
canAttack:false

[hiddenAction_smoke]
autoTrigger:if self.resource.time % 10 <5
spawnEffects:CUSTOM:smoke*1


[effect_smoke]
life:360
alsoEmitEffects:smoke
alpha:0.7
xOffsetRelative:-13
yOffsetRelative:-5
lifeRandom:100

xOffsetRelativeRandom:2
yOffsetRelativeRandom:2
xSpeedRelativeRandom:0.1
ySpeedRelativeRandom:0.1
hSpeed:0.2
color:#AA000099

fadeOut:true
scaleTo:1
scaleFrom:0




[movement]
movementType:BUILDING

[hiddenAction_initSelfExtraExp]
autoTriggerOnEvent:created
addResources:selfExtraPrice=600

[global_resource_maxFactories]
hidden:false

[ai]
buildPriority:0.95
noneInBaseExtraPriority:1
noneGlobalExtraPriority:1
